name: Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: artifacts/daily-routine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install dependencies and update lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit updated lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Update pnpm lockfile" || echo "No lockfile changes"
          git push

      - name: Check Expo config
        working-directory: artifacts/daily-routine
        run: npx expo config --json

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Link EAS project
        working-directory: artifacts/daily-routine
        run: eas init --id 85b6c593-8d04-4c06-87cd-3b8f44f96fad --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        working-directory: artifacts/daily-routine
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
